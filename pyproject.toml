[project]
name = "sayproof"
version = "0.1.0"
description = "Fact-check your talk before your audience does."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
